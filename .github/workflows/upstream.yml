name: Build Live Branch

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Forge PR metadata (artifact content fully attacker controlled)
        run: |
          printf '1\ninjected=yes\n' > pr_number.txt
          printf 'deadbeefcafe' > commit_sha.txt
      - name: Upload forged PR metadata
        uses: actions/upload-artifact@v7
        with:
          name: pr-metadata
          path: |
            pr_number.txt
            commit_sha.txt

